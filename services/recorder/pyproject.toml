[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "birdlog-recorder"
version = "0.1.0"
description = "Continuous USB audio capture for Bird Log"
requires-python = ">=3.11"
dependencies = ["sounddevice==0.5.6", "soundfile==0.14.0", "numpy==2.4.6", "cffi==1.17.1", "pycparser==2.22"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
birdlog-recorder = "birdlog_recorder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
