[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "birdlog-recorder"
version = "0.1.0"
description = "Continuous USB audio capture for Bird Log"
requires-python = ">=3.11"
dependencies = ["sounddevice==0.5.1", "soundfile==0.13.1", "numpy==2.2.6", "cffi==1.17.1", "pycparser==2.22"]

[project.scripts]
birdlog-recorder = "birdlog_recorder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
