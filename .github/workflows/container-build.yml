name: Container Build

on:
  push:
    branches: ['**']
    paths:
      - 'services/**'
      - '.github/scripts/**'
      - '.github/workflows/container-build.yml'
  pull_request:
    paths:
      - 'services/**'
      - '.github/scripts/**'
      - '.github/workflows/container-build.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom image tag (optional)'
        required: false
        type: string
      container:
        description: 'Service to build, e.g. recorder (empty builds all)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: container-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  detect-changes:
    runs-on: ubuntu-24.04
    outputs:
      containers: ${{ steps.detect.outputs.containers }}
      has_containers: ${{ steps.detect.outputs.has_containers }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Detect changed containers
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CONTAINER: ${{ inputs.container }}
          CUSTOM_TAG: ${{ inputs.tag }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_NAME: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: python3 .github/scripts/detect-containers.py

  build-and-push:
    needs: detect-changes
    if: needs.detect-changes.outputs.has_containers == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJSON(needs.detect-changes.outputs.containers) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python for service tests
        if: hashFiles(format('services/{0}/tests/test_*.py', matrix.container)) != ''
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Run service tests before building
        if: hashFiles(format('services/{0}/tests/test_*.py', matrix.container)) != ''
        env:
          SERVICE: ${{ matrix.container }}
        run: |
          python -m pip install -e "services/$SERVICE" pytest==8.3.5
          python -m pytest "services/$SERVICE/tests" -q

      - name: Set image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          SERVICE: ${{ matrix.container }}
        run: echo "name=$REGISTRY/${REPOSITORY,,}/$SERVICE" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ./services/${{ matrix.container }}
          file: ./services/${{ matrix.container }}/Containerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=buildkit-${{ matrix.container }}
            type=registry,ref=${{ steps.image.outputs.name }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=buildkit-${{ matrix.container }}
            ${{ github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch && format('type=registry,ref={0}:buildcache,mode=max', steps.image.outputs.name) || '' }}
